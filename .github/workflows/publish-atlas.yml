# Build the player-safe atlas and deploy to GitHub Pages.
#
# Triggers:
#   - push to main (auto-publish on every commit to canon)
#   - manual dispatch (with optional changelog input)
#
# Required repo settings:
#   Settings → Pages → Source: GitHub Actions
#   Settings → Actions → Workflow permissions: Read and write
#
# If this is a project site (URL = https://<user>.github.io/<repo>/), the
# workflow auto-passes the repo name as ATLAS_BASE so Vite emits correct asset
# URLs. For a user/organization site, change ATLAS_BASE to "/".

name: Publish Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      changelog:
        description: "Optional changelog note for this publish"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Static gate on the mainline. `atlas-pr-check.yml` carries the same checks but
  # only triggers on `pull_request`, and work merges straight to main here — so
  # until this job existed, nothing on the shipping path ran typecheck, lint, or
  # format:check. Deliberately excludes the test suite: it needs sharding to stay
  # inside memory limits, and the pre-commit hook already runs it per commit.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck:all
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Record changelog note
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.changelog != '' }}
        env:
          CHANGELOG_NOTE: ${{ inputs.changelog }}
        run: |
          echo "### Changelog note" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$CHANGELOG_NOTE" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build player-safe atlas (strict)
        run: npm run atlas:build:player

      - name: Build site
        env:
          ATLAS_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Scan built artifacts (full safety set)
        # D13: run the same orchestrator the local one-click check runs, so a
        # green local check implies a green CI run. This adds image-privacy,
        # fog-safety, and audit-assets, which CI previously did not run.
        run: npm run atlas:scan

      - name: Add SPA 404 fallback
        # GitHub Pages serves 404.html for any unknown path. Cloning index.html
        # lets React Router handle deep links and refreshes on /atlas/*.
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

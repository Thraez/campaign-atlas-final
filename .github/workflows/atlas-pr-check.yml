# PR safety scans for the campaign atlas.
#
# Runs on every pull request against main to catch DM/secret leaks before
# they merge. The full publish + deploy flow lives in publish-atlas.yml and
# still runs on push-to-main; this workflow only builds and scans, never
# deploys.

name: Atlas PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded pushes to the same PR cancel their in-flight run. Without this, a
# branch pushed three times in a minute burns three full scan+test matrices and
# the earliest one can report last.
concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check (app + scripts)
        run: npm run typecheck:all

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build player-safe atlas (strict)
        run: npm run atlas:build:player

      - name: Build site
        env:
          ATLAS_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Run full safety-scan orchestrator
        # All 12 scans (secrets, derived-secrets, shape, image-privacy,
        # fog-safety, player-secrets, audit-assets) against both dist and
        # public/atlas — the same orchestrator publish-atlas.yml runs post-merge.
        run: npm run atlas:scan

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run test shard ${{ matrix.shard }}/4
        run: npx vitest run --pool=forks --poolOptions.forks.maxForks=3 --shard=${{ matrix.shard }}/4

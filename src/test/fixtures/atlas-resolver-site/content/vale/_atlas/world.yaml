# R-11b frozen fixture: the player and DM site this vault builds is snapshotted
# (src/test/build/resolver-site-unchanged.test.ts). Invented content; don't edit
# without retaking the snapshot and reviewing its diff.
name: The Vale
maps:
  - id: vale
    name: Vale
    width: 1000
    height: 1000
    layers: []
    # Partial reveal: only the left half (x < 500) is lit.
    fog:
      enabled: true
      reveals:
        - [[0, 0], [500, 0], [500, 1000], [0, 1000]]
    soundscape:
      masterGain: 0.6
      areas:
        - id: lit-gulls
          name: Gulls
          visibility: player
          points: [[10, 10], [100, 10], [100, 100], [10, 100]]
          bed: { src: atlas/assets/audio/gulls.ogg }
        - id: fog-wind
          name: Fog wind
          visibility: player
          points: [[400, 10], [600, 10], [600, 100], [400, 100]]
          bed: { src: atlas/assets/audio/wind.ogg }
        - id: dm-drums
          name: Drums
          visibility: dm
          points: [[10, 10], [100, 10], [100, 100]]
          bed: { src: atlas/assets/audio/drums.ogg }
        - id: ride-harbor
          regionId: harbor-ward
          bed: { src: atlas/assets/audio/harbor.ogg, gain: 0.5 }
        - id: ride-lair
          regionId: lair
          visibility: player
          bed: { src: atlas/assets/audio/lair.ogg }
        - id: ride-marsh
          regionId: fog-marsh
          bed: { src: atlas/assets/audio/marsh.ogg }
        - name: No id
          visibility: player
          points: [[10, 200], [100, 200], [100, 300]]
          bed: { src: atlas/assets/audio/noid.ogg }
        - id: too-small
          visibility: player
          points: [[10, 10], [20, 20]]
          bed: { src: atlas/assets/audio/small.ogg }
  - id: depths
    name: Depths
    width: 800
    height: 600
    layers: []
    fog:
      enabled: false
      reveals: []
regions:
  - id: harbor-ward
    mapId: vale
    name: Harbor Ward
    entityId: harbor
    visibility: player
    points: [[10, 10], [250, 10], [250, 250], [10, 250]]
  - id: fog-marsh
    mapId: vale
    name: Fog Marsh
    visibility: player
    points: [[400, 400], [600, 400], [600, 600], [400, 600]]
  - id: lair
    mapId: vale
    name: Lair
    visibility: dm
    points: [[300, 300], [350, 300], [350, 350]]
  - id: whisper-glade
    mapId: vale
    name: Whisper Glade
    visibility: rumor
    points: [[50, 600], [150, 600], [150, 700]]
routes:
  - id: harbor-road
    mapId: vale
    name: Harbor Road
    visibility: player
    waypoints:
      - { entityId: harbor }
      - [200, 400]
      - { entityId: watchtower }
  - id: fog-road
    mapId: vale
    name: Fog Road
    visibility: player
    waypoints: [[10, 900], [900, 900]]
  - id: smugglers-path
    mapId: vale
    name: Smugglers' Path
    visibility: rumor
    waypoints: [[20, 20], [40, 480]]

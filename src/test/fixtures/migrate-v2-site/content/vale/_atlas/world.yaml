# R-20 fixture: a v1 vault for the v2 migration tests
# (scripts/atlas/migrate/migrateV2.test.ts). Invented content, built from the
# R-11b resolver fixture plus scales, map images, audio, water and a calendar.
schemaVersion: 1
name: The Vale
maps:
  - id: vale
    name: Vale
    width: 1000
    height: 1000
    scale: { unitsPerPixel: 0.5, unitLabel: mi }
    grid: { kind: hex, size: 50, enabled: false }
    oceanColor: "#18313f"
    water: { enabled: true, intensity: 0.4 }
    layers:
      - id: base
        src: atlas/assets/maps/vale-base.png
        width: 1000
        height: 1000
        opacity: 1
        zIndex: 10
    # Partial reveal: only the left half (x < 500) is lit.
    fog:
      enabled: true
      featherPx: 12
      reveals:
        - [[0, 0], [500, 0], [500, 1000], [0, 1000]]
    soundscape:
      masterGain: 0.6
      areas:
        - id: lit-gulls
          name: Gulls
          visibility: player
          points: [[10, 10], [100, 10], [100, 100], [10, 100]]
          bed: { src: atlas/assets/audio/gulls.ogg }
        - id: fog-wind
          name: Fog wind
          visibility: player
          points: [[400, 10], [600, 10], [600, 100], [400, 100]]
          bed: { src: atlas/assets/audio/wind.ogg }
        - id: dm-drums
          name: Drums
          visibility: dm
          points: [[10, 10], [100, 10], [100, 100]]
          bed: { src: atlas/assets/audio/drums.ogg }
        - id: ride-harbor
          regionId: harbor-ward
          bed: { src: atlas/assets/audio/harbor.ogg, gain: 0.5 }
        - id: ride-lair
          regionId: lair
          visibility: player
          bed: { src: atlas/assets/audio/lair.ogg }
        - id: ride-marsh
          regionId: fog-marsh
          bed: { src: atlas/assets/audio/marsh.ogg }
        - id: too-small
          visibility: player
          points: [[10, 10], [20, 20]]
          bed: { src: atlas/assets/audio/small.ogg }
  - id: depths
    name: Depths
    width: 800
    height: 600
    scale: { unitsPerPixel: 2, unitLabel: ft }
    water: { enabled: true, intensity: 0.4 }
    layers:
      - id: base
        src: atlas/assets/maps/depths-base.png
        width: 800
        height: 600
    fog:
      enabled: false
      reveals: []
regions:
  - id: harbor-ward
    mapId: vale
    name: Harbor Ward
    entityId: harbor
    visibility: player
    points: [[10, 10], [250, 10], [250, 250], [10, 250]]
  - id: fog-marsh
    mapId: vale
    name: Fog Marsh
    visibility: player
    points: [[400, 400], [600, 400], [600, 600], [400, 600]]
  - id: lair
    mapId: vale
    name: Lair
    visibility: dm
    points: [[300, 300], [350, 300], [350, 350]]
  - id: whisper-glade
    mapId: vale
    name: Whisper Glade
    visibility: rumor
    points: [[50, 600], [150, 600], [150, 700]]
  - id: cellar
    mapId: depths
    name: Cellar
    points: [[10, 10], [60, 10], [60, 60]]
  - id: thin-strip
    mapId: depths
    name: Thin strip
    visibility: player
    points: [[0, 0], [100, 100]]
routes:
  - id: harbor-road
    mapId: vale
    name: Harbor Road
    visibility: player
    waypoints:
      - { entityId: harbor }
      - [200, 400]
      - { entityId: watchtower }
  - id: fog-road
    mapId: vale
    name: Fog Road
    visibility: player
    waypoints: [[10, 900], [900, 900]]
  - id: smugglers-path
    mapId: vale
    name: Smugglers' Path
    visibility: rumor
    waypoints: [[20, 20], [40, 480]]
calendar:
  name: Vale Reckoning
  months:
    - { name: Thaw, days: 30 }
    - { name: Harvest, days: 31 }
credits:
  badges: false
import:
  folders:
    npc: people
  defaultFolder: imports
